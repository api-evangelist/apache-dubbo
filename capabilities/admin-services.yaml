naftiko: 1.0.0-alpha2
info:
  label: Dubbo-Admin API — Services
  description: 'Dubbo-Admin API — Services. 5 operations. Lead operation: Apache Dubbo Get All Applications. Self-contained
    Naftiko capability covering one Apache Dubbo business surface.'
  tags:
  - Apache Dubbo
  - Services
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_DUBBO_API_KEY: APACHE_DUBBO_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-services
    baseUri: https://127.0.0.1:38080
    description: Dubbo-Admin API — Services business capability. Self-contained, no shared references.
    resources:
    - name: api-env-applications
      path: /api/{env}/applications
      operations:
      - name: get
        method: GET
        description: Apache Dubbo Get All Applications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: env
          in: path
          type: string
          description: environment
    - name: api-env-consumers
      path: /api/{env}/consumers
      operations:
      - name: get
        method: GET
        description: Apache Dubbo Get All Consumers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: env
          in: path
          type: string
          description: environment
    - name: api-env-service
      path: /api/{env}/service
      operations:
      - name: get
        method: GET
        description: Apache Dubbo Search Services by Different Patterns and Keywords
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: env
          in: path
          type: string
          description: environment
        - name: pattern
          in: query
          type: string
          description: 'supported values: application, service or ip'
          required: true
        - name: filter
          in: query
          type: string
          description: keyword to search
          required: true
        - name: page
          in: query
          type: string
          description: page number
        - name: size
          in: query
          type: string
          description: page size
    - name: api-env-service-service
      path: /api/{env}/service/{service}
      operations:
      - name: get
        method: GET
        description: Apache Dubbo Show Detail of the Specified Service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: env
          in: path
          type: string
          description: environment
        - name: service
          in: path
          type: string
          description: 'service format: ''group/service:version'''
          required: true
    - name: api-env-services
      path: /api/{env}/services
      operations:
      - name: get
        method: GET
        description: Apache Dubbo Get All Services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: env
          in: path
          type: string
          description: environment
  exposes:
  - type: rest
    namespace: admin-services-rest
    port: 8080
    description: REST adapter for Dubbo-Admin API — Services. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/{env}/applications
      name: api-env-applications
      description: REST surface for api-env-applications.
      operations:
      - method: GET
        name: get
        description: Apache Dubbo Get All Applications
        call: admin-services.get
        with:
          env: rest.env
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/{env}/consumers
      name: api-env-consumers
      description: REST surface for api-env-consumers.
      operations:
      - method: GET
        name: get
        description: Apache Dubbo Get All Consumers
        call: admin-services.get
        with:
          env: rest.env
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/{env}/service
      name: api-env-service
      description: REST surface for api-env-service.
      operations:
      - method: GET
        name: get
        description: Apache Dubbo Search Services by Different Patterns and Keywords
        call: admin-services.get
        with:
          env: rest.env
          pattern: rest.pattern
          filter: rest.filter
          page: rest.page
          size: rest.size
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/{env}/service/{service}
      name: api-env-service-service
      description: REST surface for api-env-service-service.
      operations:
      - method: GET
        name: get
        description: Apache Dubbo Show Detail of the Specified Service
        call: admin-services.get
        with:
          env: rest.env
          service: rest.service
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/{env}/services
      name: api-env-services
      description: REST surface for api-env-services.
      operations:
      - method: GET
        name: get
        description: Apache Dubbo Get All Services
        call: admin-services.get
        with:
          env: rest.env
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-services-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dubbo-Admin API — Services. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: apache-dubbo-get-all-applications
      description: Apache Dubbo Get All Applications
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-services.get
      with:
        env: tools.env
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-dubbo-get-all-consumers
      description: Apache Dubbo Get All Consumers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-services.get
      with:
        env: tools.env
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-dubbo-search-services-different
      description: Apache Dubbo Search Services by Different Patterns and Keywords
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-services.get
      with:
        env: tools.env
        pattern: tools.pattern
        filter: tools.filter
        page: tools.page
        size: tools.size
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-dubbo-show-detail-specified
      description: Apache Dubbo Show Detail of the Specified Service
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-services.get
      with:
        env: tools.env
        service: tools.service
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-dubbo-get-all-services
      description: Apache Dubbo Get All Services
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-services.get
      with:
        env: tools.env
      outputParameters:
      - type: object
        mapping: $.
