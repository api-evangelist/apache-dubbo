naftiko: "1.0.0-alpha1"

info:
  label: "Apache Dubbo Admin API"
  description: "REST API for managing and governing Apache Dubbo microservices clusters including services, traffic rules, routing, and configuration."
  tags:
    - Apache Dubbo
    - Service Governance
    - Microservices
    - Traffic Management
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      DUBBO_ADMIN_BASE_URL: DUBBO_ADMIN_BASE_URL

capability:
  consumes:
    - type: http
      namespace: dubbo-admin
      baseUri: "http://localhost:38080"
      description: "Apache Dubbo Admin REST API for service governance"
      resources:
        - name: applications
          path: /api/{env}/applications
          description: Manage Dubbo applications in the cluster
          operations:
            - name: list-applications
              method: GET
              description: List all applications registered in the Dubbo cluster
              inputParameters:
                - name: env
                  in: path
                  type: string
                  required: true
                  description: Environment name (e.g. dev, prod)
                - name: service
                  in: query
                  type: string
                  required: false
                  description: Filter by service name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: services
          path: /api/{env}/services
          description: Manage Dubbo services
          operations:
            - name: list-services
              method: GET
              description: List all services registered in the Dubbo cluster
              inputParameters:
                - name: env
                  in: path
                  type: string
                  required: true
                  description: Environment name
                - name: app
                  in: query
                  type: string
                  required: false
                  description: Filter by application name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: traffic-rules
          path: /api/{env}/rules
          description: Manage traffic routing and configuration rules
          operations:
            - name: list-condition-routes
              method: GET
              description: List all condition routing rules
              inputParameters:
                - name: env
                  in: path
                  type: string
                  required: true
                  description: Environment name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-condition-route
              method: POST
              description: Create a new condition routing rule
              inputParameters:
                - name: env
                  in: path
                  type: string
                  required: true
                  description: Environment name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  conditions: "{{tools.conditions}}"
                  service: "{{tools.service}}"

        - name: metrics
          path: /api/{env}/metrics
          description: Cluster metrics and monitoring data
          operations:
            - name: get-cluster-metrics
              method: GET
              description: Get overview metrics for the Dubbo cluster
              inputParameters:
                - name: env
                  in: path
                  type: string
                  required: true
                  description: Environment name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: dubbo-admin-rest
      resources:
        - path: /v1/applications
          name: applications
          description: Dubbo application management
          operations:
            - method: GET
              name: list-applications
              description: List Dubbo applications
              call: "dubbo-admin.list-applications"
              with:
                env: "rest.env"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/services
          name: services
          description: Dubbo service management
          operations:
            - method: GET
              name: list-services
              description: List Dubbo services
              call: "dubbo-admin.list-services"
              with:
                env: "rest.env"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: dubbo-admin-mcp
      transport: http
      tools:
        - name: list-applications
          description: List all applications registered in the Dubbo cluster
          hints:
            readOnly: true
            openWorld: true
          call: "dubbo-admin.list-applications"
          with:
            env: "tools.env"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-services
          description: List all services registered in the Dubbo cluster
          hints:
            readOnly: true
            openWorld: true
          call: "dubbo-admin.list-services"
          with:
            env: "tools.env"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-cluster-metrics
          description: Get overview metrics for the Dubbo cluster
          hints:
            readOnly: true
            openWorld: true
          call: "dubbo-admin.get-cluster-metrics"
          with:
            env: "tools.env"
          outputParameters:
            - type: object
              mapping: "$."
