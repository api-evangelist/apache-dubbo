aid: apache-dubbo
name: Apache Dubbo
description: >-
  Apache Dubbo is a high-performance, Java-based open-source RPC framework that provides service discovery, traffic
  management, and observability capabilities for building enterprise-level microservices. It supports multiple protocols
  including Triple (gRPC-compatible), Dubbo, and REST, with SDKs for Java, Go, Node.js, Python, Rust, and Erlang.
