openapi: 3.2.0
info:
  description: This is a dubbo-admin swagger ui server.
  title: Dubbo-Admin Tag Rule API
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
servers:
- url: https://127.0.0.1:38080/
tags:
- name: TagRule
paths:
  /api/{env}/rules/route/tag:
    get:
      description: Search rule
      tags:
      - TagRule
      summary: Apache Dubbo Search Rule
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      - description: application and service must not left empty at the same time
        name: application
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/model.TagRouteDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: getApiByEnvRulesRouteTag
      x-operation-id-source: derived
    post:
      description: Create a new tag rule
      tags:
      - TagRule
      summary: Apache Dubbo Create a New Tag Rule
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.TagRouteDto'
        description: rule input
        required: true
      operationId: postApiByEnvRulesRouteTag
      x-operation-id-source: derived
  /api/{env}/rules/route/tag/disable/{id}:
    put:
      description: Disable the specified rule
      tags:
      - TagRule
      summary: Apache Dubbo Disable the Specified Rule
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      - description: rule id
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: putApiByEnvRulesRouteTagDisableById
      x-operation-id-source: derived
  /api/{env}/rules/route/tag/enable/{id}:
    put:
      description: Enable the specified rule
      tags:
      - TagRule
      summary: Apache Dubbo Enable the Specified Rule
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      - description: rule id
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: putApiByEnvRulesRouteTagEnableById
      x-operation-id-source: derived
  /api/{env}/rules/route/tag/{id}:
    get:
      description: Show the detail of one specified rule
      tags:
      - TagRule
      summary: Apache Dubbo Show the Detail of One Specified Rule
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      - description: rule id
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.TagRouteDto'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: getApiByEnvRulesRouteTagById
      x-operation-id-source: derived
    post:
      description: Update rule
      tags:
      - TagRule
      summary: Apache Dubbo Update Rule
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      - description: rule id
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/model.TagRouteDto'
        description: rule input
        required: true
      operationId: postApiByEnvRulesRouteTagById
      x-operation-id-source: derived
    delete:
      description: Delete the specified rule
      tags:
      - TagRule
      summary: Apache Dubbo Delete the Specified Rule
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      - description: rule id
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: deleteApiByEnvRulesRouteTagById
      x-operation-id-source: derived
components:
  schemas:
    model.Tag:
      type: object
      required:
      - match
      - name
      properties:
        addresses:
          type: array
          items:
            type: string
        match:
          type: array
          items:
            $ref: '#/components/schemas/model.ParamMatch'
        name:
          type: string
    model.HTTPError:
      type: object
      properties:
        error:
          description: error message
          type: string
    model.StringMatch:
      type: object
      properties:
        empty:
          type: string
        exact:
          type: string
        noempty:
          type: string
        prefix:
          type: string
        regex:
          type: string
        wildcard:
          type: string
    model.TagRouteDto:
      type: object
      required:
      - configVersion
      - enabled
      - tags
      properties:
        application:
          type: string
        configVersion:
          type: string
        enabled:
          type: boolean
        force:
          type: boolean
        id:
          type: string
        priority:
          type: integer
        runtime:
          type: boolean
        service:
          type: string
        serviceGroup:
          type: string
        serviceVersion:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/model.Tag'
    model.ParamMatch:
      type: object
      properties:
        key:
          type: string
        value:
          $ref: '#/components/schemas/model.StringMatch'
