openapi: 3.2.0
info:
  description: This is a dubbo-admin swagger ui server.
  title: Dubbo-Admin Services API
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
servers:
- url: https://127.0.0.1:38080/
tags:
- name: Services
paths:
  /api/{env}/applications:
    get:
      description: Get all applications
      tags:
      - Services
      summary: Apache Dubbo Get All Applications
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: getApiByEnvApplications
      x-operation-id-source: derived
  /api/{env}/consumers:
    get:
      description: Get all consumers
      tags:
      - Services
      summary: Apache Dubbo Get All Consumers
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: getApiByEnvConsumers
      x-operation-id-source: derived
  /api/{env}/service:
    get:
      description: Search services by different patterns and keywords
      tags:
      - Services
      summary: Apache Dubbo Search Services by Different Patterns and Keywords
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      - description: 'supported values: application, service or ip'
        name: pattern
        in: query
        required: true
        schema:
          type: string
      - description: keyword to search
        name: filter
        in: query
        required: true
        schema:
          type: string
      - description: page number
        name: page
        in: query
        schema:
          type: string
      - description: page size
        name: size
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ListServiceByPage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: getApiByEnvService
      x-operation-id-source: derived
  /api/{env}/service/{service}:
    get:
      description: Show detail of the specified service
      tags:
      - Services
      summary: Apache Dubbo Show Detail of the Specified Service
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      - description: 'service format: ''group/service:version'''
        name: service
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.ServiceDetailDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: getApiByEnvServiceByService
      x-operation-id-source: derived
  /api/{env}/services:
    get:
      description: Get all services
      tags:
      - Services
      summary: Apache Dubbo Get All Services
      parameters:
      - description: environment
        name: env
        in: path
        schema:
          type: string
          default: dev
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.HTTPError'
      operationId: getApiByEnvServices
      x-operation-id-source: derived
components:
  schemas:
    time.Duration:
      type: integer
      enum:
      - 1
      - 1000
      - 1000000
      - 1000000000
      - 60000000000
      - 3600000000000
      - 1
      - 1000
      - 1000000
      - 1000000000
      - 60000000000
      - 3600000000000
      x-enum-varnames:
      - Nanosecond
      - Microsecond
      - Millisecond
      - Second
      - Minute
      - Hour
      - Nanosecond
      - Microsecond
      - Millisecond
      - Second
      - Minute
      - Hour
    model.HTTPError:
      type: object
      properties:
        error:
          description: error message
          type: string
    model.ListServiceByPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/model.ServiceDTO'
        first:
          type: boolean
        last:
          type: boolean
        offset:
          type: integer
        pageNumber:
          type: string
        size:
          type: string
        totalElements:
          type: integer
        totalPages:
          type: integer
    model.Provider:
      type: object
      properties:
        address:
          type: string
        alived:
          type: integer
        application:
          type: string
        created:
          type: string
        dynamic:
          type: boolean
        enabled:
          type: boolean
        expired:
          $ref: '#/components/schemas/time.Duration'
        hash:
          type: string
        id:
          type: integer
        ids:
          type: array
          items:
            type: integer
        miss:
          type: boolean
        modified:
          type: string
        now:
          type: string
        operator:
          type: string
        operatorAddress:
          type: string
        parameters:
          type: string
        registry:
          type: string
        registrySource:
          $ref: '#/components/schemas/model.RegistrySource'
        serialization:
          type: string
        service:
          type: string
        timeout:
          type: integer
        url:
          type: string
        username:
          type: string
        weight:
          type: integer
    model.ServiceDetailDTO:
      type: object
      properties:
        application:
          type: string
        consumers:
          type: array
          items:
            $ref: '#/components/schemas/model.Consumer'
        metadata: {}
        providers:
          type: array
          items:
            $ref: '#/components/schemas/model.Provider'
        service:
          type: string
    model.ServiceDTO:
      type: object
      properties:
        appName:
          type: string
        group:
          type: string
        registrySource:
          $ref: '#/components/schemas/model.RegistrySource'
        service:
          type: string
        version:
          type: string
    model.Consumer:
      type: object
      properties:
        address:
          type: string
        alived:
          type: integer
        application:
          type: string
        collected:
          $ref: '#/components/schemas/time.Duration'
        created:
          type: string
        expired:
          $ref: '#/components/schemas/time.Duration'
        hash:
          type: string
        id:
          type: integer
        ids:
          type: array
          items:
            type: integer
        miss:
          type: boolean
        modified:
          type: string
        now:
          type: string
        operator:
          type: string
        operatorAddress:
          type: string
        parameters:
          type: string
        registry:
          type: string
        result:
          type: string
        service:
          type: string
        statistics:
          type: string
        username:
          type: string
    model.RegistrySource:
      type: string
      enum:
      - ALL
      x-enum-varnames:
      - All
